name: CI

on:
  push:
    branches: [main, codex/windows-support]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Expected stable package version for a manual release
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Check and pack (Ubuntu, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '24'

      - name: Check release version
        if: inputs.release-version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: node --import tsx scripts/check-release-version.ts

      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run package:check

      - name: Pack once for all platforms
        run: |
          mkdir -p artifacts/npm
          npm pack --ignore-scripts --pack-destination artifacts/npm
          mv artifacts/npm/*.tgz artifacts/package.tgz

      - name: Save npm archive for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/package.tgz
          if-no-files-found: error
          retention-days: 7

  check:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm run test:run
      - name: Download the common npm archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm
      - run: npm run package:smoke -- artifacts/npm/package.tgz
