name: CI

on:
  push:
    branches: [main, codex/windows-support]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Expected stable package version for a manual release
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install pinned npm (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm_spec=$(node -p "require('./package.json').packageManager")
          npm install --global "$npm_spec"
          node --version
          npm --version

      - name: Install pinned npm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $npmSpec = node -p "require('./package.json').packageManager"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global $npmSpec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          npm --version

      - name: Check release version
        if: inputs.release-version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: node scripts/check-release-version.mjs

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
      - run: npm run package:check
      - run: npm run package:smoke

      - name: Save verified npm archive
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  git-producer:
    name: Git producer (${{ matrix.os }}, Node 24)
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
        with:
          node-version: '24'
      - run: npm run build
      - run: npm run test:git -- produce artifacts/git-producer
      - name: Save Git bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-bundles-${{ matrix.os }}
          path: artifacts/git-producer/*
          if-no-files-found: error
          retention-days: 7

  git-consumer:
    name: Git consumer (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: git-producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - name: Download all producer bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: git-bundles-*
          path: artifacts/git-input
      - run: npm run test:git -- consume artifacts/git-input
